# .github/workflows/build.yml
name: Build ESP32-C5 Firmware with PlatformIO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      - name: List build artifacts
        run: ls -la .pio/build/seeed-xiao-esp32-c5/

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c5-firmware
          path: .pio/build/seeed-xiao-esp32-c5/firmware.bin
          retention-days: 90
