name: APEX-ULTRA-Multi-Architecture-Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Nhóm ESP32 Classic (WROOM, D, E, U, PICO-D4)
          - id: "ESP32_Classic"
            target: "esp32"
            flash: "4MB"
          
          # Nhóm ESP32-S series
          - id: "ESP32_S2"
            target: "esp32s2"
            flash: "4MB"
          - id: "ESP32_S3_N8"
            target: "esp32s3"
            flash: "8MB"
          - id: "ESP32_S3_N16R8"
            target: "esp32s3"
            flash: "16MB"

          # Nhóm RISC-V (C series)
          - id: "ESP32_C5"
            target: "esp32c5"
            flash: "4MB"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1 # C5 yêu cầu version IDF mới
          target: ${{ matrix.target }}
          command: |
            # 1. Tải và thiết lập Arduino Component + Libraries
            mkdir -p components
            cd components
            git clone --recursive https://github.com/espressif/arduino-esp32.git arduino
            git clone https://github.com/me-no-dev/AsyncTCP.git
            git clone https://github.com/me-no-dev/ESPAsyncWebServer.git
            git clone https://github.com/bblanchon/ArduinoJson.git
            cd ..

            # 2. Cấu hình NAT & RAM tối ưu theo Target
            echo "CONFIG_AUTOSTART_ARDUINO=y" > sdkconfig.defaults
            echo "CONFIG_LWIP_IP_FORWARD=y" >> sdkconfig.defaults
            echo "CONFIG_LWIP_IPV4_NAPT=y" >> sdkconfig.defaults
            
            # Tùy chỉnh Flash Size theo Matrix
            if [ "${{ matrix.flash }}" = "8MB" ]; then
              echo "CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y" >> sdkconfig.defaults
            elif [ "${{ matrix.flash }}" = "16MB" ]; then
              echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
              echo "CONFIG_SPIRAM=y" >> sdkconfig.defaults
              echo "CONFIG_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
            else
              echo "CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y" >> sdkconfig.defaults
            fi

            # 3. Chạy lệnh Build
            idf.py build
            
            # 4. Lưu tên file theo biến thể
            mv build/APEX_ULTRA_S3.bin build/APEX_${{ matrix.id }}.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Firmware-${{ matrix.id }}
          path: |
            build/APEX_${{ matrix.id }}.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
