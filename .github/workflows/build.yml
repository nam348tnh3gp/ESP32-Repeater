name: Build ESP32 NAT Router

"on":
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 1: Build ESP-IDF (main.c) bằng PlatformIO
  build-espidf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build firmware (main.c - ESP-IDF)
        run: pio run

      - name: Merge 3 files into 1 (merged.bin)
        run: |
          cd .pio/build/esp32dev/
          esptool.py --chip esp32 merge_bin -o merged.bin \
            0x1000 bootloader.bin \
            0x8000 partitions.bin \
            0x10000 firmware.bin
          echo "✅ Merged file created: merged.bin"
          ls -lh merged.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-nat-router
          path: .pio/build/esp32dev/merged.bin

      - name: Upload individual files (optional)
        uses: actions/upload-artifact@v4
        with:
          name: esp32-individual-files
          path: |
            .pio/build/esp32dev/bootloader.bin
            .pio/build/esp32dev/partitions.bin
            .pio/build/esp32dev/firmware.bin

      - name: Verify build
        run: |
          echo "📦 File merged.bin size:"
          ls -lh .pio/build/esp32dev/merged.bin
          echo "✅ Build and merge successful!"

  # Job 2: Build Arduino (ESP_Code.ino) với arduino-cli
  build-arduino-ino:
    needs: build-espidf
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Update core index & install ESP32 core
        run: |
          arduino-cli core update-index \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Update library index
        run: arduino-cli lib update-index

      - name: Debug requirements.arduino content
        run: |
          echo "📄 Raw content of requirements.arduino:"
          cat -A requirements.arduino
          echo ""
          echo "📊 Line count:"
          wc -l requirements.arduino
          echo ""
          echo "🔍 Parsing each line:"
          while IFS= read -r line; do
            [[ -z "$line" ]] && echo "  → Empty line"
            [[ "$line" =~ ^# ]] && echo "  → Comment: $line"
          done < requirements.arduino

      - name: Install libraries from requirements.arduino (Hybrid - Fixed)
        run: |
          # Bật chế độ cài từ git
          arduino-cli config set library.enable_unsafe_install true

          # Đọc từng dòng và xử lý
          while IFS= read -r line; do
            # Bỏ qua dòng trống và comment
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            
            # Trim khoảng trắng đầu và cuối dòng
            line_trimmed=$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [[ -z "$line_trimmed" ]] && continue
            
            # Tách field1 và field2
            field1=$(echo "$line_trimmed" | awk '{print $1}')
            field2=$(echo "$line_trimmed" | awk '{print $2}')
            
            echo "🔧 Processing: field1='$field1', field2='$field2'"
            
            # Kiểm tra xem dòng có chứa URL (http/https) không
            if [[ -n "$field2" && "$field2" =~ ^https?:// ]]; then
              # Đây là Git URL - cài từ GitHub
              echo "📦 Installing $field1 from Git: $field2 ..."
              arduino-cli lib install --git-url "$field2"
            elif [[ -n "$field1" ]]; then
              # Đây là tên@phiên bản - cài từ Library Manager
              echo "📦 Installing $field1 from Library Manager ..."
              arduino-cli lib install "$field1"
            else
              echo "⚠️ Skipping invalid line: $line_trimmed"
            fi
          done < requirements.arduino

      - name: Verify installed libraries
        run: |
          echo "📚 Installed libraries in Arduino/libraries:"
          ls -la ~/Arduino/libraries/ | grep -E "AsyncTCP|ESPAsyncWebServer|ArduinoJson" || echo "⚠️ Some libraries not found!"

      - name: Prepare sketch folder
        run: |
          mkdir -p build_sketch/ESP_Code
          cp ESP_Code.ino build_sketch/ESP_Code/ESP_Code.ino

      - name: Compile sketch (ESP_Code.ino - Arduino framework)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir ./build-output \
            build_sketch/ESP_Code

      - name: Upload .ino build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp_code_ino_build
          path: build-output/*