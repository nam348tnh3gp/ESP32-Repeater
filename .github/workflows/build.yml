name: Build ESP32 NAT Router

"on":
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # cho phép chạy thủ công

permissions:
  contents: read

jobs:
  # Job 1: Build ESP-IDF (main.c) bằng PlatformIO
  build-espidf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build firmware (main.c - ESP-IDF)
        run: pio run

      - name: Merge 3 files into 1 (merged.bin)
        run: |
          cd .pio/build/esp32dev/
          esptool.py --chip esp32 merge_bin -o merged.bin \
            0x1000 bootloader.bin \
            0x8000 partitions.bin \
            0x10000 firmware.bin
          echo "✅ Merged file created: merged.bin"
          ls -lh merged.bin

      - name: Upload merged firmware (1 file duy nhất)
        uses: actions/upload-artifact@v4
        with:
          name: esp32-nat-router
          path: .pio/build/esp32dev/merged.bin

      - name: Upload individual files (optional, để debug)
        uses: actions/upload-artifact@v4
        with:
          name: esp32-individual-files
          path: |
            .pio/build/esp32dev/bootloader.bin
            .pio/build/esp32dev/partitions.bin
            .pio/build/esp32dev/firmware.bin

      - name: Verify build
        run: |
          echo "📦 File merged.bin size:"
          ls -lh .pio/build/esp32dev/merged.bin
          echo "✅ Build and merge successful!"

  # Job 2: Build Arduino (ESP_Code.ino) bằng arduino-cli, sử dụng requirements.arduino (Hybrid)
  build-arduino-ino:
    needs: build-espidf
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Update core index & install ESP32 core
        run: |
          arduino-cli core update-index \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 \
            --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Update library index
        run: arduino-cli lib update-index

      - name: Install libraries from requirements.arduino (Hybrid)
        run: |
          # Bật chế độ cài từ git
          arduino-cli config set library.enable_unsafe_install true

          while IFS= read -r line; do
            # Bỏ qua dòng trống và comment
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            
            # Tách các trường
            field1=$(echo "$line" | awk '{print $1}')
            field2=$(echo "$line" | awk '{print $2}')
            
            # Kiểm tra xem dòng có chứa URL (http/https) không
            if [[ "$field2" =~ ^https?:// ]]; then
              # Đây là Git URL - cài từ GitHub
              lib_name="$field1"
              git_url="$field2"
              echo "Installing $lib_name from Git: $git_url ..."
              arduino-cli lib install --git-url "$git_url"
            else
              # Đây là tên@phiên bản - cài từ Library Manager
              lib_spec="$field1"
              echo "Installing $lib_spec from Library Manager ..."
              arduino-cli lib install "$lib_spec"
            fi
          done < requirements.arduino

      # arduino-cli yêu cầu file .ino nằm trong thư mục trùng tên
      - name: Prepare sketch folder
        run: |
          mkdir -p build_sketch/ESP_Code
          cp ESP_Code.ino build_sketch/ESP_Code/ESP_Code.ino

      - name: Compile sketch (ESP_Code.ino - Arduino framework)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir ./build-output \
            build_sketch/ESP_Code

      - name: Upload .ino build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp_code_ino_build
          path: build-output/*