name: for esp32c5

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with Docker
        run: |
          docker build -t esp32c5-builder .
          docker create --name builder esp32c5-builder
          docker cp builder:/firmware/build/ ./artifacts/
          docker rm builder
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: artifacts/*.bin
