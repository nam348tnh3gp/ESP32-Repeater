name: Build ESP32-C5 Firmware with Docker (Arduino CLI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t esp32c5-builder .

      - name: Run container to compile
        run: docker run --name builder esp32c5-builder

      - name: Copy firmware from container
        run: |
          mkdir -p artifacts
          docker cp builder:/firmware/ESP_Code/build/ ./artifacts/
          docker rm builder

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c5-firmware
          path: artifacts/build/*.bin
          retention-days: 90
