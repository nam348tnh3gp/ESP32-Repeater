name: Build ESP32-C5 Arduino CLI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  arduino-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install & Setup Arduino CLI
        run: |
          # 1. Cài đặt vào thư mục nội bộ
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          
          # 2. Đưa đường dẫn vào $GITHUB_PATH để các bước sau nhận diện được lệnh
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH
          
          # 3. Kiểm tra cài đặt ngay lập tức
          export PATH=$PATH:${{ github.workspace }}/bin
          arduino-cli version

      - name: Configure ESP32-C5 Platform
        run: |
          arduino-cli config init
          # Sử dụng URL hỗ trợ dòng C5 (Pioarduino)
          arduino-cli config add board_manager.additional_urls https://github.com/pioarduino/arduino-esp32/releases/download/55.3.37/package_pioarduino_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Async Libraries (Fix for RISC-V/C5)
        run: |
          arduino-cli lib install "ArduinoJson"
          
          # Cài đặt thủ công các thư viện Async để đảm bảo tương thích ESP32 Core v3 (C5)
          mkdir -p $HOME/Arduino/libraries
          cd $HOME/Arduino/libraries
          git clone https://github.com/mathieucarbou/AsyncTCP.git
          git clone https://github.com/mathieucarbou/ESPAsyncWebServer.git

      - name: Compile NAT Router for ESP32-C5
        run: |
          # Tạo thư mục tạm để chứa code đúng chuẩn Arduino (Thư mục trùng tên file .ino)
          mkdir -p build_output
          mkdir -p project_folder
          cp main.cpp project_folder/project_folder.ino
          
          # Thực hiện biên dịch với Flag NAT và Target C5
          arduino-cli compile -b esp32:esp32:esp32c5 \
            --build-property "build.extra_flags=-DCONFIG_LWIP_IPV4_NAPT=1 -DCONFIG_IDF_TARGET_ESP32C5=1" \
            --output-dir ./build_output \
            ./project_folder/project_folder.ino

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-C5-V19-Firmware
          path: ./build_output/*.bin
