name: Build ESP32 NAT Router

"on":
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Core 4.0.0 là bản đã build thật trên CI (log trước đó). Nâng có chủ đích khi cần.
  ESP32_CORE_VERSION: "4.0.0"

jobs:
  # Job 0: test logic dùng chung (DNS, parse form, JSON escape, ...) trên máy host
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests (ASan + UBSan)
        run: ./tests/run.sh

  # Job 1: Build ESP-IDF (main.c) bằng PlatformIO
  build-espidf:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install PlatformIO & esptool
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build firmware (main.c - ESP-IDF)
        run: pio run

      - name: Merge 3 files into 1 (merged.bin)
        run: |
          cd .pio/build/esp32dev/
          esptool.py --chip esp32 merge_bin -o merged.bin \
            0x1000 bootloader.bin \
            0x8000 partitions.bin \
            0x10000 firmware.bin
          echo "✅ Merged file created: merged.bin"
          ls -lh merged.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-nat-router
          path: .pio/build/esp32dev/merged.bin

      - name: Upload individual files (optional)
        uses: actions/upload-artifact@v4
        with:
          name: esp32-individual-files
          path: |
            .pio/build/esp32dev/bootloader.bin
            .pio/build/esp32dev/partitions.bin
            .pio/build/esp32dev/firmware.bin

  # Job 2: Build Arduino (ESP_Code.ino) với arduino-cli (độc lập với Job 1)
  build-arduino-ino:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Update core index & install ESP32 core (pinned)
        run: |
          URL=https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}" --additional-urls "$URL"

      - name: Update library index
        run: arduino-cli lib update-index

      - name: Install libraries from requirements.arduino
        shell: bash
        run: |
          arduino-cli config set library.enable_unsafe_install true
          grep -vE '^[[:space:]]*#|^[[:space:]]*$' requirements.arduino | while IFS= read -r line; do
            field1=$(echo "$line" | awk '{print $1}')
            field2=$(echo "$line" | awk '{print $2}')
            echo "Processing: '$field1' '$field2'"
            if [[ -n "$field2" && "$field2" =~ ^https?:// ]]; then
              arduino-cli lib install --git-url "$field2"
            else
              arduino-cli lib install "$field1"
            fi
          done

      - name: Prepare sketch folder (sketch + header dùng chung)
        run: |
          mkdir -p build_sketch/ESP_Code
          cp ESP_Code.ino apex_common.h apex_dns.h apex_ui.h build_sketch/ESP_Code/
          ls -la build_sketch/ESP_Code

      - name: Compile sketch (ESP_Code.ino - Arduino framework)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir ./build-output \
            build_sketch/ESP_Code

      - name: Upload .ino build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp_code_ino_build
          path: build-output/*
