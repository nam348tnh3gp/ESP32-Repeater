name: APEX-ULTRA-Universal-Build-Fixed

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "ESP32_Standard"
            target: "esp32"
            flash: "4MB"
          - id: "ESP32_S2"
            target: "esp32s2"
            flash: "4MB"
          - id: "ESP32_S3_N16R8"
            target: "esp32s3"
            flash: "16MB"
            psram: "opi"
          - id: "ESP32_C3" # Thay C5 bằng C3 nếu v5.1 chưa hỗ trợ tốt C5
            target: "esp32c3"
            flash: "4MB"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          # Ép xung về v5.1 để tương thích hoàn hảo với Arduino Core
          esp_idf_version: v5.1
          target: ${{ matrix.target }}
          command: |
            # 1. Tạo cấu hình sạch
            rm -rf components
            mkdir -p components
            
            # 2. Tải các component với nhánh (branch) ổn định
            git clone --recursive --branch esp-idf-v5.1-libs --depth 1 https://github.com/espressif/arduino-esp32.git components/arduino
            git clone --depth 1 https://github.com/me-no-dev/AsyncTCP.git components/AsyncTCP
            git clone --depth 1 https://github.com/me-no-dev/ESPAsyncWebServer.git components/ESPAsyncWebServer
            git clone --depth 1 https://github.com/bblanchon/ArduinoJson.git components/ArduinoJson

            # 3. Cấu hình hệ thống (sdkconfig)
            echo "CONFIG_AUTOSTART_ARDUINO=y" > sdkconfig.defaults
            echo "CONFIG_LWIP_IPV4_NAPT=y" >> sdkconfig.defaults
            echo "CONFIG_LWIP_IP_FORWARD=y" >> sdkconfig.defaults
            
            # Xử lý Flash/PSRAM
            if [ "${{ matrix.flash }}" = "16MB" ]; then
              echo "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" >> sdkconfig.defaults
            else
              echo "CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y" >> sdkconfig.defaults
            fi

            if [ "${{ matrix.psram }}" = "opi" ]; then
              echo "CONFIG_SPIRAM=y" >> sdkconfig.defaults
              echo "CONFIG_SPIRAM_MODE_OCT=y" >> sdkconfig.defaults
            fi

            # 4. Biên dịch
            # Dùng --ccache để tăng tốc nếu chạy lại
            idf.py build
            
            # 5. Kiểm tra và di chuyển file
            if [ -f build/APEX_ULTRA.bin ]; then
              mv build/APEX_ULTRA.bin build/APEX_${{ matrix.id }}.bin
            else
              echo "Build failed, .bin not found!"
              exit 1
            fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Firmware-${{ matrix.id }}
          path: |
            build/APEX_${{ matrix.id }}.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
