name: Build ESP32-C5 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install PlatformIO
        run: |
          pip install --upgrade pip
          pip install platformio
      
      - name: Update PlatformIO
        run: pio upgrade
      
      - name: Build firmware
        run: pio run -e esp32-c5-devkitc-1
      
      - name: List build artifacts
        run: ls -la .pio/build/esp32-c5-devkitc-1/
      
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c5-firmware
          path: |
            .pio/build/esp32-c5-devkitc-1/firmware.bin
            .pio/build/esp32-c5-devkitc-1/bootloader.bin
            .pio/build/esp32-c5-devkitc-1/partitions.bin
          retention-days: 30
