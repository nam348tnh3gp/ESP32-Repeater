name: APEX-ULTRA-Final-Fix

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "ESP32_Standard"
            target: "esp32"
          - id: "ESP32_S3_N16R8"
            target: "esp32s3"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1
          target: ${{ matrix.target }}
          command: |
            # 1. Dọn dẹp môi trường build
            rm -rf components build dependencies.lock
            mkdir -p components
            
            # 2. Clone Arduino core (Dùng lệnh clone tường minh để tránh lỗi resolve)
            git clone --branch esp-idf-v5.1-libs --depth 1 https://github.com/espressif/arduino-esp32.git components/arduino-esp32
            
            # 3. Cập nhật submodules cho Arduino (BẮT BUỘC để có đủ driver)
            cd components/arduino-esp32
            git submodule update --init --recursive --depth 1
            cd ../..
            
            # 4. Clone các thư viện mạng
            git clone --depth 1 https://github.com/me-no-dev/AsyncTCP.git components/AsyncTCP
            git clone --depth 1 https://github.com/me-no-dev/ESPAsyncWebServer.git components/ESPAsyncWebServer
            git clone --depth 1 https://github.com/bblanchon/ArduinoJson.git components/ArduinoJson

            # 5. Kiểm tra sự tồn tại của thư mục (Log sẽ hiện ở đây)
            ls -d components/*/ 

            # 6. Tạo file cấu hình mặc định
            echo "CONFIG_AUTOSTART_ARDUINO=y" > sdkconfig.defaults
            echo "CONFIG_LWIP_IPV4_NAPT=y" >> sdkconfig.defaults
            echo "CONFIG_LWIP_IP_FORWARD=y" >> sdkconfig.defaults

            # 7. Biên dịch
            idf.py build
            
            # 8. Di chuyển file đầu ra
            if [ -f build/APEX_ULTRA.bin ]; then
              mv build/APEX_ULTRA.bin build/APEX_${{ matrix.id }}.bin
            fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Firmware-${{ matrix.id }}
          path: |
            build/APEX_${{ matrix.id }}.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
