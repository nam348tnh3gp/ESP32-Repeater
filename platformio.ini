[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-c5-m4-evk ; Hoặc board tương đương cho C5
framework = arduino
monitor_speed = 112500

; Thư viện cần thiết dựa trên code của bạn
lib_deps =
    ottowinter/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.1.3
    bblanchon/ArduinoJson @ ^7.0.4

; Tối ưu hóa build
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_LWIP_IPV4_NAPT=1
    -DCONFIG_IDF_TARGET_ESP32C5=1
