; ============================================================================
; PlatformIO Configuration for APEX ULTRA V22.0.2 - ESP-IDF NAT ROUTER (FIXED)
; Build 100% với ESP-IDF framework
; ============================================================================

[platformio]
default_envs = esp32dev
; FIX: project dùng cấu trúc component chuẩn ESP-IDF (main/CMakeLists.txt +
; main/main.c), không phải mô hình "src/" mặc định của PlatformIO. Khai báo
; src_dir = main để PlatformIO không còn đòi hỏi 1 thư mục "src/" riêng.
src_dir = main

[common]
monitor_speed = 115200
framework = espidf
platform = espressif32
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

; Build flags cho ESP-IDF
; Lưu ý: CONFIG_LWIP_IP_FORWARD / CONFIG_LWIP_NAT / CONFIG_ESP_TASK_WDT... là
; các Kconfig option, không phải macro tiền xử lý -> phải đặt trong
; sdkconfig.defaults (đã có sẵn ở project root), KHÔNG đặt qua -D ở đây vì
; -D không có tác dụng gì tới hệ thống Kconfig của ESP-IDF.
build_flags = 
    -DCONFIG_ESP32_DEBUG_STUBS_ENABLE=y

[env:esp32dev]
extends = common
board = esp32dev

; Monitor configuration
monitor_speed = ${common.monitor_speed}
monitor_raw = yes

; Upload configuration
upload_speed = 921600
upload_port = /dev/ttyUSB0

; Build type
build_type = release

; Partition table (tùy chọn)
board_build.partitions = default.csv

; Debug
debug_tool = esp-prog
debug_init_break = tbreak app_main

; sdkconfig.defaults ở project root được PlatformIO tự động nhận diện,
; không cần khai báo thêm option nào (board_build.menuconfig không phải
; option hợp lệ của PlatformIO nên đã bị bỏ khỏi file này).