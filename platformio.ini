[env:seeed-xiao-esp32-c5]               ; Tên môi trường (tùy chọn)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip
board = seeed-xiao-esp32-c5             ; Board ID chính xác cho XIAO ESP32-C5, tham khảo từ tài liệu chính thức[reference:0]
framework = arduino
monitor_speed = 115200
board_build.partitions = default_4MB.csv

build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLWIP_NAPT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps = 
    ayushsharma82/ESPAsyncDNSServer @ ^1.0.0
    me-no-dev/AsyncTCP @ ^1.1.1
    me-no-dev/ESPAsyncWebServer @ ^1.2.6
    bblanchon/ArduinoJson @ ^6.19.4
