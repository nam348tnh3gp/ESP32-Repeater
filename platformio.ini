; ============================================================================
; PlatformIO Configuration for APEX ULTRA V22.0.1 - ESP-IDF NAT ROUTER
; Build 100% với ESP-IDF framework, không lỗi
; ============================================================================

[platformio]
default_envs = esp32dev

[common]
monitor_speed = 115200
framework = espidf
platform = espressif32
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

; Build flags cho ESP-IDF
build_flags = 
    -DCONFIG_LWIP_IP_FORWARD=1
    -DCONFIG_LWIP_NAT=1
    -DCONFIG_ESP32_DEBUG_STUBS_ENABLE=y
    -DCONFIG_ESP_SYSTEM_PANIC_PRINT_REBOOT=y

[env:esp32dev]
extends = common
board = esp32dev

; Monitor configuration
monitor_speed = ${common.monitor_speed}
monitor_raw = yes

; Upload configuration
upload_speed = 921600
upload_port = /dev/ttyUSB0

; Build type
build_type = release

; Partition table (tùy chọn)
board_build.partitions = default.csv

; Debug
debug_tool = esp-prog
debug_init_break = tbreak app_main

; ============================================================================
; Cấu hình menuconfig (tự động bật NAT)
; ============================================================================
board_build.menuconfig = sdkconfig.defaults
