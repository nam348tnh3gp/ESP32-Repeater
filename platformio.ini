; PlatformIO Project Configuration File cho ESP32 NAT Repeater
; Tinh gọn từ cấu trúc của dự án Bruce

[platformio]
default_envs =
	esp32-s3-devkitc-1
	esp32-c3-devkit

; Cấu hình thư mục cache (giữ nguyên để tăng tốc build)
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache

[env]
; Sử dụng platform mới nhất để hỗ trợ ESP32-C5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip ; Arduino 3.3.6

platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20260123-153546.zip ; Arduino 3.3.6

monitor_filters = esp32_exception_decoder, send_on_enter, colorize
framework = arduino
board_build.filesystem = littlefs

; Các cảnh báo khi build (giữ lại để code sạch hơn)
build_src_flags =
	-Wall
	-Wclobbered
	-Wempty-body
	-Wignored-qualifiers
	-Woverloaded-virtual=0
	-Wtype-limits
	-Wno-unused-label
	-Wno-comment
	-Wno-unused-variable
	-Wno-narrowing

; Lọc các file không cần thiết
build_src_filter =
	+<*>
	-<.git/>
	-<.svn/>

; Các cờ build chung cho dự án Repeater
build_flags =
	-DCORE_DEBUG_LEVEL=0
	-Os
	-Wl,--print-memory-usage
	-Wl,--gc-sections
	; Tối ưu cho AsyncTCP để tiết kiệm RAM
	-DCONFIG_ASYNC_TCP_STACK_SIZE=4096
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	-DCONFIG_ASYNC_TCP_USE_WDT=0

; Chỉ giữ lại các thư viện cần thiết cho NAT Repeater
lib_deps =
	bblanchon/ArduinoJson@^6.21.3
	esphome/AsyncTCP-esphome@^2.1.0
	esphome/ESPAsyncWebServer-esphome@^3.3.0

monitor_speed = 115200
upload_speed = 921600

; ==================== Môi trường cho ESP32-S3 ====================
[env:esp32-s3-devkitc-1]
extends = env
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

; ==================== Môi trường cho ESP32-C5 ====================
[env:esp32-c3-devkit]
extends = env
board = esp32-c3-devkit
board_build.partitions = default_8MB.csv
