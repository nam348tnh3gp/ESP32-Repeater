; PlatformIO Project Configuration File
;
; Build firmware for ESP32-WROOM module
; Check compilation errors

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Thư viện cần thiết
lib_deps =
    me-no-dev/AsyncTCP@^1.1.1
    me-no-dev/ESPAsyncWebServer@^1.2.3
    bblanchon/ArduinoJson@^6.21.3

; Tuỳ chọn build (tăng cảnh báo, tối ưu kích thước)
build_flags =
    -Wall
    -Os
    -DARDUINO_CORE_VERSION_MAJOR=3
    -DCORE_DEBUG_LEVEL=1

; Cổng Serial (để upload, tuỳ chỉnh theo máy)
monitor_speed = 115200
upload_speed = 921600
