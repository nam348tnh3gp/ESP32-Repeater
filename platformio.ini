; ============================================================================
; PlatformIO - APEX ULTRA ESP-IDF NAT ROUTER (bản chính, nguồn: main/main.c)
; Bản Arduino (ESP_Code.ino) dùng chung 3 header apex_*.h ở thư mục gốc.
; ============================================================================

[platformio]
default_envs = esp32dev
; Chọn đúng env theo CHIP của board: esp32dev = ESP32 thường, esp32s3 = ESP32-S3.
; Firmware build cho chip này KHÔNG chạy được trên chip kia (bootloader offset và chip-id khác nhau).
; Dự án dùng cấu trúc component chuẩn ESP-IDF (main/CMakeLists.txt + main/main.c).
src_dir = main

[common]
monitor_speed = 115200
framework = espidf
; Ghim nhánh 6.x (ESP-IDF >= 5.3): main.c cần esp_task_wdt_reconfigure() (IDF >= 5.1).
; Không ghim thì mỗi lần PlatformIO ra bản mới là build có thể đổi.
platform = espressif32@^6.9.0
board_build.flash_mode = dio
; Phân vùng app 1.875 MB (mặc định chỉ 1 MB, ESP32-C6 build ra ~1.07 MB nên bị tràn flash).
board_build.partitions = partitions.csv

; Lưu ý: mọi option Kconfig (CONFIG_LWIP_*, CONFIG_ESP_TASK_WDT_*...) phải nằm trong
; sdkconfig.defaults, KHÔNG đặt qua -D. Sau khi sửa sdkconfig.defaults hãy xoá file
; sdkconfig và thư mục .pio/ ở máy local để PlatformIO sinh lại cấu hình.

[env:esp32dev]
extends = common
board = esp32dev
board_build.f_cpu = 240000000L
monitor_speed = ${common.monitor_speed}
monitor_raw = yes
upload_speed = 921600
; upload_port: để PlatformIO tự dò cổng (đặt cứng /dev/ttyUSB0 chỉ đúng với Linux).
build_type = release

; Bảng phân vùng: xem partitions.csv (1 app, không OTA). Muốn OTA thì thêm otadata + ota_0/ota_1.

debug_tool = esp-prog
debug_init_break = tbreak app_main

; ---------------------------------------------------------------------------
; Các chip khác. Mỗi chip là một env riêng vì firmware KHÔNG dùng chéo được giữa các chip.
; Bootloader offset khi merge: esp32/esp32s2 = 0x1000; esp32s3/esp32c3/esp32c6 = 0x0 (xem CI).
; Board octal flash/PSRAM (vd. S3 N16R8) cần thêm cấu hình riêng trong sdkconfig.
; ---------------------------------------------------------------------------
[env:esp32s2]
extends = common
board = esp32-s2-saola-1
board_build.f_cpu = 240000000L
monitor_speed = ${common.monitor_speed}
monitor_raw = yes
upload_speed = 921600
build_type = release

[env:esp32s3]
extends = common
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
monitor_speed = ${common.monitor_speed}
monitor_raw = yes
upload_speed = 921600
build_type = release

[env:esp32c3]
extends = common
board = esp32-c3-devkitm-1
monitor_speed = ${common.monitor_speed}
monitor_raw = yes
upload_speed = 921600
build_type = release

[env:esp32c6]
extends = common
board = esp32-c6-devkitc-1
monitor_speed = ${common.monitor_speed}
monitor_raw = yes
upload_speed = 921600
build_type = release
