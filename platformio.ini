[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

build_flags = 
    -DCORE_DEBUG_LEVEL=1
    -DLWIP_NAPT=1
    -DIP_FORWARD=1

lib_deps =
    me-no-dev/AsyncTCP@^1.1.1
    me-no-dev/ESPAsyncWebServer@^1.2.3
    bblanchon/ArduinoJson@^6.21.3

monitor_speed = 115200
upload_speed = 921600
