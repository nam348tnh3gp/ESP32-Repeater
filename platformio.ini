; PlatformIO Project Configuration File cho ESP32 NAT Repeater
; Đã sửa lỗi thiếu IPv6Address.h

[platformio]
default_envs =
	esp32-s3
	esp32-c5

build_cache_dir = .pio/buildcache
cache_dir = .pio/cache

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip ; Arduino 3.3.6

platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20260123-153546.zip ; Arduino 3.3.6

monitor_filters = esp32_exception_decoder, send_on_enter, colorize
framework = arduino
board_build.filesystem = littlefs

build_src_flags =
	-Wall
	-Wclobbered
	-Wempty-body
	-Wignored-qualifiers
	-Woverloaded-virtual=0
	-Wtype-limits
	-Wno-unused-label
	-Wno-comment
	-Wno-unused-variable
	-Wno-narrowing

build_src_filter =
	+<*>
	-<.git/>
	-<.svn/>

build_flags =
	-DCORE_DEBUG_LEVEL=0
	-Os
	-Wl,--print-memory-usage
	-Wl,--gc-sections
	-DCONFIG_ASYNC_TCP_STACK_SIZE=4096
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	-DCONFIG_ASYNC_TCP_USE_WDT=0

; Thay thế bằng thư viện gốc me-no-dev
lib_deps =
	bblanchon/ArduinoJson@^6.21.3
	me-no-dev/AsyncTCP@^1.1.1
	me-no-dev/ESPAsyncWebServer@^1.2.3

monitor_speed = 115200
upload_speed = 921600

[env:esp32-s3]
extends = env
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv

[env:esp32-c5]
extends = env
board = esp32-c5-devkitc-1
board_build.partitions = default_8MB.csv
