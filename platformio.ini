; PlatformIO Project Configuration cho ESP32 NAT Repeater
; Đã cập nhật platform để tương thích ESP32-C5

[common]
monitor_speed = 115200
upload_speed = 921600
framework = arduino
lib_deps =
    ; Sử dụng các thư viện tương thích tốt với Arduino core v3.x
    esphome/AsyncTCP-esphome@^2.1.0
    esphome/ESPAsyncWebServer-esphome@^3.3.0
    bblanchon/ArduinoJson@^6.21.3

; ==================== ESP32-S3 ====================
[env:esp32-s3]
; Nâng lên phiên bản platform mới để đồng bộ
platform = espressif32@~6.10.0
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
lib_deps = ${common.lib_deps}
build_flags =
    -DCORE_DEBUG_LEVEL=0

; ==================== ESP32-C5 ====================
[env:esp32-c5]
; Bắt buộc dùng platform >= 6.8.0 để nhận diện board C5
platform = espressif32@~6.10.0
board = esp32-c5-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = default_8MB.csv
lib_deps = ${common.lib_deps}
build_flags =
    -DCORE_DEBUG_LEVEL=0
