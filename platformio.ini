; PlatformIO Project Configuration File cho ESP32 NAT Repeater
; Tối ưu để build cho ESP32-S3 và ESP32-C5

[platformio]
default_envs =
    esp32-s3-devkitc-1
    esp32-c5-devkitc-1

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20260123-153546.zip

framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder, send_on_enter, colorize

; Thư mục chứa variants nếu có (tùy chọn)
; board_build.variants_dir = boards

; Các cờ build chung cho tất cả môi trường
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Os
    -Wl,--print-memory-usage
    -Wl,--gc-sections
    ; Tối ưu cho AsyncTCP
    -DCONFIG_ASYNC_TCP_STACK_SIZE=4096
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0

; Các thư viện dùng chung
lib_deps =
    ; Core Libraries
    bblanchon/ArduinoJson@^6.21.3
    ; Networking
    esphome/AsyncTCP-esphome@^2.1.0
    esphome/ESPAsyncWebServer-esphome@^3.3.0

[env:esp32-s3-devkitc-1]
extends = env
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}

[env:esp32-c5-devkitc-1]
extends = env
board = esp32-c5-devkitc-1
board_build.partitions = default_8MB.csv
build_flags =
    ${env.build_flags}
