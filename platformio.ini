; PlatformIO Project Configuration
; APEX ULTRA V22.0.1 - Standalone ESP32 NAT Router
; ============================================================================

[platformio]
default_envs = esp32dev

[common]
monitor_speed = 115200
framework = arduino
platform = espressif32
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

; Thư viện cần thiết
lib_deps = 
    ottowinter/ESPAsyncWebServer-esphome@^3.0.0
    bblanchon/ArduinoJson@^6.21.3
    khoih-prog/ESPAsyncDNSServer@^1.0.0

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_RUNNING_CORE=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

[env:esp32dev]
extends = common
board = esp32dev

; Tùy chọn monitor
monitor_speed = ${common.monitor_speed}
monitor_raw = yes

; Partition table (dùng default hoặc custom)
board_build.partitions = default_16MB.csv

; Upload tốc độ cao
upload_speed = 921600

; Tối ưu build
build_type = release

; Debug
debug_tool = esp-prog
debug_init_break = tbreak setup

; ============================================================================
; Các config cũ đã được bỏ/gộp:
; - extra_script_settings (không cần)
; - merge_to_single_bin (không cần cho file .ino)
; - embed_txtfiles (web file đã embedded trong code)
; - pre/post extra script (không cần)
; ============================================================================
