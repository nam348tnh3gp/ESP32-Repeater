; PlatformIO Project Configuration cho ESP32 NAT Repeater
; Tối ưu cho ESP32-S3 và ESP32-C5

[common]
monitor_speed = 115200
upload_speed = 921600
framework = arduino
lib_deps =
    ; Các thư viện cần cho dự án NAT Repeater
    ; Các bạn có thể cần cài thêm nếu dùng core cũ, nhưng thường core ESP32 đã có sẵn
    me-no-dev/AsyncTCP@^1.1.1
    me-no-dev/ESPAsyncWebServer@^1.2.3
    bblanchon/ArduinoJson@^6.21.3

; ==================== Môi trường cho ESP32-S3 ====================
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.flash_mode = qio
board_build.partitions = default_8MB.csv  ; Sử dụng partition 8MB cho S3
lib_deps = ${common.lib_deps}

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Quan trọng: Cho S3 biết nó không hỗ trợ 5GHz (theo code detect board)
    ; Code sẽ tự động nhận diện là ESP32-S3 và tắt 5GHz

; ==================== Môi trường cho ESP32-C5 ====================
[env:esp32-c5]
platform = espressif32
board = esp32-c5-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = default_8MB.csv  ; C5 dùng 8MB
lib_deps = ${common.lib_deps}

build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Quan trọng: Cho C5 biết nó HỖ TRỢ 5GHz
    ; Code sẽ nhận diện C5 và cho phép cấu hình kênh 5GHz
    ; Không cần define thêm vì code dùng CONFIG_IDF_TARGET_ESP32C5 để nhận biết
