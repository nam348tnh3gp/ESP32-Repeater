; ============================================================================
; PlatformIO Configuration for APEX ULTRA V22.0.2 - ESP-IDF NAT ROUTER (FIXED)
; Build 100% với ESP-IDF framework
; ============================================================================

[platformio]
default_envs = esp32dev
; Project dùng cấu trúc component chuẩn ESP-IDF (main/CMakeLists.txt +
; main/main.c), không phải mô hình "src/" mặc định của PlatformIO.
src_dir = main

[common]
monitor_speed = 115200
framework = espidf
platform = espressif32
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

; Build flags cho ESP-IDF
; Lưu ý: các option Kconfig (CONFIG_LWIP_IP_FORWARD, CONFIG_ESP_TASK_WDT...)
; phải đặt trong sdkconfig.defaults, KHÔNG đặt qua -D ở đây.
build_flags = 
    -DCONFIG_ESP32_DEBUG_STUBS_ENABLE=y

[env:esp32dev]
extends = common
board = esp32dev

; Monitor configuration
monitor_speed = ${common.monitor_speed}
monitor_raw = yes

; Upload configuration
upload_speed = 921600
upload_port = /dev/ttyUSB0

; Build type
build_type = release

; FIX: đã bỏ `board_build.partitions = default.csv` — option này chỉ tồn tại
; sẵn cho framework Arduino (PlatformIO có kho .csv riêng cho nó). Với
; framework espidf, PlatformIO tìm file .csv này thẳng trong project root và
; không thấy -> "Missing partition table file". ESP-IDF sẽ tự dùng bảng
; phân vùng mặc định (Single factory app, không OTA) khai báo qua
; sdkconfig.defaults, không cần chỉ định gì thêm ở đây. Nếu sau này cần OTA
; hoặc nhiều phân vùng, tạo file partitions.csv thật ở project root rồi mới
; khai báo board_build.partitions = partitions.csv.

; Debug
debug_tool = esp-prog
debug_init_break = tbreak app_main